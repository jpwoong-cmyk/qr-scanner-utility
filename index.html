<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b2b">
  <meta name="description" content="SCANme-QR. Tap, scan, open.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SCANme-QR">
  <title>SCANme-QR</title>
  <link rel="icon" href="J_logo_icon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  <script type="module" src="qr-generator.js"></script>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4H9.5L7.6 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.6L14.5 4Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9"/><path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.2-2"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="m21 16-5-5-9 10"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 9a7 7 0 0 1 12-2l2 5M4 12l2 5a7 7 0 0 0 12-2"/></symbol>
    <symbol id="i-add-home" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 6h4m-2 4v8m-4-4h8"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-icon" aria-hidden="true"><img src="J_logo.png" alt="" width="84" height="34"></span>
        <strong class="wordmark" aria-label="SCANme-QR">SCANme-<svg class="brand-qr" viewBox="0 0 25 25" aria-hidden="true" focusable="false">
          <!-- Stylized pixels only; deliberately not an encoded/scannable QR code. -->
          <path d="M1 1h8v8H1zm15 0h8v8h-8zM1 16h8v8H1z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 4h2v2H4zm15 0h2v2h-2zM4 19h2v2H4zm9-8h2v2h-2zM20 12h3v3h-3zm-7 7h3v3h-3zm6 1h3v3h-3z" fill="currentColor"/>
        </svg></strong>
      </div>
      <button class="shortcut-trigger" id="add-shortcut" type="button" aria-label="Tap to add SCANme-QR to your home screen" title="Add to Home Screen"><svg class="icon" aria-hidden="true"><use href="#i-add-home"/></svg><span>Add shortcut</span></button>
    </header>

    <main>
      <section class="scanner-view" id="scanner-view" aria-label="QR scanner">
        <div class="camera-frame" id="camera-frame">
          <span class="inner-border-orbit" aria-hidden="true"></span>
          <video id="camera-video" autoplay muted playsinline aria-label="Live camera preview"></video>
          <canvas id="camera-switch-preview" class="camera-switch-preview" aria-hidden="true" hidden></canvas>

          <div class="camera-placeholder" id="camera-placeholder">
            <div class="idle-panel">
              <div class="idle-mark qr-repair pixel-workshop" aria-hidden="true">
                <svg class="qr-repair-art" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                  <!-- The QR pixels are decorative, not a scannable code. -->
                  <g class="qr-repair-finders" fill="none" stroke="#c5e8f5" stroke-width="3">
                    <path d="M8 10h18v18H8zM14 16h6v6h-6zM40 10h18v18H40zM46 16h6v6h-6zM8 42h18v18H8zM14 48h6v6h-6z"/>
                  </g>
                  <g fill="#b6e9fa">
                    <g class="qr-repair-pixels-a"><path d="M30 12h5v5h-5zM30 23h5v5h-5zM30 34h5v5h-5zM40 34h5v5h-5z"/></g>
                    <g class="qr-repair-pixels-b"><path d="M52 34h5v5h-5zM30 45h5v5h-5zM41 45h5v5h-5zM52 45h5v5h-5z"/></g>
                    <g class="qr-repair-pixels-c"><path d="M30 56h5v5h-5zM41 56h5v5h-5zM52 56h5v5h-5zM18 34h5v5h-5z"/></g>
                  </g>
                  <!-- Tiny pixel mechanic travels between the missing modules. -->
                  <g class="pixel-robot">
                    <rect x="0" y="0" width="19" height="16" rx="2" fill="#67c7e9"/>
                    <rect x="3" y="3" width="13" height="8" fill="#16304b"/>
                    <rect x="5" y="5" width="3" height="3" fill="#a5ffdb"/>
                    <rect x="11" y="5" width="3" height="3" fill="#a5ffdb"/>
                    <rect x="7" y="-4" width="4" height="4" fill="#d5eff8"/>
                    <rect x="8" y="-7" width="2" height="3" fill="#79f4df"/>
                    <rect x="-3" y="5" width="3" height="7" fill="#d0e9f4"/>
                    <rect x="19" y="5" width="3" height="7" fill="#d0e9f4"/>
                    <rect x="3" y="16" width="5" height="5" fill="#8aaec4"/>
                    <rect x="12" y="16" width="5" height="5" fill="#8aaec4"/>
                    <rect x="22" y="10" width="5" height="3" fill="#ffcf77"/>
                    <rect x="27" y="8" width="2" height="7" fill="#e7f8ff"/>
                    <rect class="pixel-spark" x="29" y="9" width="3" height="3" fill="#8fffe1"/>
                  </g>
                </svg>
              </div>
              <button class="btn btn-primary" id="start-camera" type="button"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span>Tap to Scan</span></button>
              <button class="upload-button" id="choose-image" type="button"><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>Upload from documents</button>
              <p class="status-line" id="camera-status" role="status" aria-live="polite" data-state="idle"><span id="camera-status-text">Camera off</span></p>
            </div>
          </div>

          <div class="scan-guide" aria-hidden="true"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span class="scan-beam"></span></div>
          <canvas id="freeze-frame" class="freeze-frame" aria-hidden="true" hidden></canvas>
          <div class="scan-transition" id="scan-transition" role="status" aria-live="polite" hidden>
            <span class="check-pulse" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
            <strong>Checking link…</strong>
            <span class="check-progress" aria-hidden="true"><span></span></span>
          </div>

          <div class="zoom-control" id="zoom-control" hidden>
            <output id="zoom-value" for="zoom-slider">0</output>
            <input type="range" id="zoom-slider" min="0" max="100" step="1" value="0" aria-label="Extra camera zoom" aria-valuetext="0 extra zoom">
            <span class="zoom-caption">ZOOM</span>
          </div>
          <div class="live-controls" id="live-controls" hidden>
            <button class="live-stop" id="stop-camera" type="button" aria-label="Stop scanning"><svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg><span>Stop</span></button>
          <div class="live-tools">
            <button class="live-tool" id="switch-camera" type="button" aria-label="Flip camera" title="Flip camera" hidden><svg class="icon" aria-hidden="true"><use href="#i-flip"/></svg></button>
            <button class="live-tool" id="toggle-flash" type="button" aria-label="Turn flash on" title="Flash" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-flash"/></svg></button>
            <button class="live-tool camera-cycle" id="select-camera" type="button" aria-label="Switch to next detected camera" title="Next camera" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
              <span class="camera-number" id="camera-number">1</span>
            </button>
          </div>
          </div>
        </div>
        <input type="file" id="image-input" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" class="visually-hidden" aria-label="Choose QR image from documents">
      </section>

      <section class="result-view" id="result-view" aria-labelledby="result-title" hidden>
        <span class="result-success" aria-hidden="true">
          <svg class="drawn-check" viewBox="0 0 54 54" fill="none" aria-hidden="true">
            <circle class="check-ring" cx="27" cy="27" r="23" stroke="currentColor" stroke-width="3"/>
            <path class="check-stroke" d="M15 27.5 23.5 36 40 19" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h1 id="result-title" tabindex="-1">Ok done. Open?</h1>
        <p class="security-pill" id="security-pill" hidden></p>
        <div class="result-content" id="result-text" aria-label="Decoded QR content"></div>
        <p class="link-caution" id="link-caution" hidden></p>
        <section class="site-identity" id="site-identity" aria-label="Website identity" hidden>
          <div class="site-identity-heading">
            <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
            <span>Website identity</span>
          </div>
          <div class="site-identity-main">
            <div class="site-identity-icon" aria-hidden="true">WWW</div>
            <div class="site-identity-details">
              <strong id="site-identity-domain"></strong>
              <span id="site-identity-protocol"></span>
            </div>
          </div>
          <p class="site-identity-note" id="site-identity-note"></p>
        </section>
        <div class="result-actions">
          <a class="btn btn-primary" id="open-link" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" hidden><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>Open</a>
          <button class="btn btn-primary" id="review-link" type="button" hidden>Review link</button>
          <button class="btn btn-primary" id="copy-text" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Copy text</button>
          <button class="btn btn-secondary" id="scan-again" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>Scan again</button>
        </div>
      </section>
    </main>
  </div>

  <dialog class="permission-dialog" id="permission-dialog" aria-labelledby="permission-title" aria-describedby="permission-message">
    <div class="permission-inner">
      <span class="permission-mark" aria-hidden="true"><img src="J_logo_icon.png" alt="" width="48" height="48"></span>
      <h2 id="permission-title">Use camera?</h2>
      <p id="permission-message">Paiseh ah, need your permission first.</p>
      <div class="permission-actions">
        <button class="btn btn-secondary" id="cancel-permission" type="button">Not now</button>
        <button class="btn btn-primary" id="confirm-permission" type="button">Ok can</button>
      </div>
    </div>
  </dialog>

  <dialog class="shortcut-dialog" id="shortcut-dialog" aria-labelledby="shortcut-title" aria-describedby="shortcut-message">
    <div class="shortcut-inner">
      <span class="permission-mark" aria-hidden="true"><img src="J_logo_icon.png" alt="" width="48" height="48"></span>
      <h2 id="shortcut-title">Put me on Home Screen?</h2>
      <p id="shortcut-message">Open your browser menu and choose Add to Home screen.</p>
      <button class="btn btn-primary" id="close-shortcut" type="button">Ok steady</button>
    </div>
  </dialog>

  <dialog class="shortcut-dialog risk-dialog" id="risk-dialog" aria-labelledby="risk-title" aria-describedby="risk-message">
    <div class="shortcut-inner">
      <div class="risk-icon" aria-hidden="true">!</div>
      <h2 id="risk-title">Open anyway ah?</h2>
      <p id="risk-message"></p>
      <div class="permission-actions">
        <button class="btn btn-secondary" id="risk-cancel" type="button">Don't open</button>
        <a class="btn btn-primary" id="risk-open" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">Open anyway</a>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
