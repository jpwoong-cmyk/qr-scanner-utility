<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Scan QR codes with your camera or from a photo.">
  <title>QR Scanner</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4H9.5L7.6 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.6L14.5 4Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9"/><path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.8 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.2-2"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="m21 16-5-5-9 10"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 9a7 7 0 0 1 12-2l2 5M4 12l2 5a7 7 0 0 0 12-2"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <span class="brand-icon" aria-hidden="true"><svg class="icon"><use href="#i-qr"/></svg></span>
      <strong>QR Scanner</strong>
    </header>

    <main>
      <section class="scanner-view" id="scanner-view" aria-label="QR scanner">
        <div class="camera-frame" id="camera-frame">
          <video id="camera-video" autoplay muted playsinline aria-label="Live camera preview"></video>
          <div class="camera-placeholder" id="camera-placeholder">
            <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
            <span>Camera is off</span>
          </div>
          <div class="scan-guide" aria-hidden="true"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
          <div class="zoom-control" id="zoom-control" hidden>
            <output id="zoom-value" for="zoom-slider">1×</output>
            <input type="range" id="zoom-slider" min="1" max="5" step="any" value="1" aria-label="Camera zoom">
            <span class="zoom-caption">ZOOM</span>
          </div>
        </div>
        <p class="status-line" id="camera-status" role="status" aria-live="polite"><span class="status-dot"></span><span id="camera-status-text">Camera off</span></p>
        <div class="camera-actions">
          <button class="btn btn-primary" id="start-camera" type="button"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span>Start camera</span></button>
          <button class="btn btn-secondary" id="stop-camera" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg><span>Stop</span></button>
          <button class="btn btn-secondary btn-square" id="switch-camera" type="button" aria-label="Flip camera" title="Flip camera" hidden><svg class="icon" aria-hidden="true"><use href="#i-flip"/></svg></button>
          <button class="btn btn-secondary btn-square" id="toggle-flash" type="button" aria-label="Turn flash on" title="Flash" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-flash"/></svg></button>
        </div>
        <div class="upload-actions">
          <button class="upload-button" id="choose-image" type="button"><svg class="icon" aria-hidden="true"><use href="#i-image"/></svg> Scan an image instead</button>
          <input type="file" id="image-input" accept="image/*" class="visually-hidden" aria-label="Choose QR image">
        </div>
      </section>

      <section class="result-view" id="result-view" aria-labelledby="result-title" hidden>
        <span class="result-success" aria-hidden="true"><svg class="icon"><use href="#i-check"/></svg></span>
        <h1 id="result-title" tabindex="-1">QR code scanned</h1>
        <div class="result-content" id="result-text" aria-label="Decoded QR content"></div>
        <div class="result-actions">
          <a class="btn btn-primary" id="open-link" target="_blank" rel="noopener noreferrer" hidden><svg class="icon" aria-hidden="true"><use href="#i-external"/></svg> Open</a>
          <button class="btn btn-primary" id="copy-text" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg> Copy text</button>
          <button class="btn btn-secondary" id="scan-again" type="button"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg> Scan again</button>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
